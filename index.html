<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101921"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>AusgabenWerk</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101921;color:#f1f6fa}*{box-sizing:border-box}body{margin:0}main{max-width:1080px;margin:auto;padding:32px 20px 70px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:26px}h1{font-size:26px;letter-spacing:-1px;margin:0}h2{font-size:17px;margin:0 0 20px}p{color:#a6b6c4;font-size:14px}small{color:#a6b6c4}.logo{color:#71edb6}section,.stat{background:#192630;border:1px solid #2b3b48;border-radius:20px;padding:24px}.layout{display:grid;grid-template-columns:360px 1fr;gap:20px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}.stat strong{display:block;font-size:28px;margin-top:8px;letter-spacing:-1px}.stat{padding:20px}label{display:block;color:#b9c8d3;font-size:13px;margin:16px 0 7px}input,select,button{font:inherit;border-radius:11px;min-height:46px}input,select{width:100%;padding:10px 12px;background:#101c25;color:white;border:1px solid #3a4b59}input:focus,select:focus{outline:2px solid #71edb6}button{border:1px solid #3a4b59;background:#243644;color:#edf5fa;padding:10px 16px;cursor:pointer}button:hover{filter:brightness(1.15)}.primary{background:#71edb6;color:#10281d;border:0;font-weight:700;width:100%;margin-top:22px}.amount{font-size:32px}.row{display:flex;gap:10px;align-items:center}.row>*{min-width:0;flex:1}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{font-size:13px}.history{margin-top:20px}.entry{display:flex;gap:12px;align-items:center;padding:16px 0;border-top:1px solid #2b3b48}.entry .info{flex:1}.entry strong{display:block}.entry small{display:block;margin-top:4px}.entry button{padding:5px 10px;min-height:34px;font-size:12px}.chart{display:flex;align-items:center;gap:24px;flex-wrap:wrap}.donut{width:170px;height:170px;flex-shrink:0;border-radius:50%;position:relative;background:#2b3b48}.donut:after{content:'';position:absolute;inset:28px;border-radius:50%;background:#192630}.legend{flex:1;min-width:160px}.legendline{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin:12px 0}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}.bar{height:5px;border-radius:8px;background:#2b3b48;margin-top:5px}.bar i{display:block;height:100%;border-radius:8px}.muted{color:#9eafbd}.empty{padding:25px 0;text-align:center;color:#a6b6c4}.hidden{display:none}#message{min-height:24px;color:#71edb6;font-size:14px;margin:12px 0}footer{margin-top:24px} @media(max-width:760px){main{padding:24px 16px 50px}.layout{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}.stat strong{font-size:24px}section{padding:20px}.entry{flex-wrap:wrap}.entry .info{min-width:40%}}
</style></head><body><main><header><div><h1><span class="logo">◈</span> AusgabenWerk</h1><p>Deine Ausgaben. Dein Überblick.</p></div><div><label for="month">Zeitraum</label><input type="month" id="month"></div></header><div class="layout"><div><section><h2 id="formTitle">Neue Ausgabe</h2><form id="form"><label for="amount">Betrag in €</label><input class="amount" id="amount" inputmode="decimal" placeholder="0,00" required autocomplete="off"><label for="category">Kategorie</label><div class="row"><select id="category"></select><button type="button" id="addCategory" style="flex:0 0 48px" aria-label="Kategorie hinzufügen">+</button></div><label for="date">Datum</label><input type="date" id="date" required><label for="note">Notiz (optional)</label><input id="note" maxlength="200" placeholder="z. B. Einkauf bei Lidl"><button class="primary" id="save">Ausgabe speichern</button><button type="button" id="cancel" class="hidden" style="width:100%;margin-top:8px">Abbrechen</button></form><div id="message" role="status" aria-live="polite"></div></section><footer><div class="actions"><button id="backup">Sicherung</button><button id="restore">Importieren</button><button id="csv">CSV exportieren</button></div><input class="hidden" type="file" id="file" accept="application/json,.json"><p>Nur auf diesem Gerät gespeichert. Sichere deine Daten regelmäßig – beim Löschen der Browserdaten gehen sie verloren. Kein automatischer Geräteabgleich.</p></footer></div><div><div class="stats"><div class="stat"><small>Ausgaben im Monat</small><strong id="total">0,00 €</strong></div><div class="stat"><small>Anzahl Buchungen</small><strong id="count">0</strong></div></div><section><h2>Wohin geht dein Geld?</h2><div id="chart" class="chart"></div></section><section class="history"><div class="row"><h2>Buchungen</h2><select id="filter" aria-label="Buchungen nach Kategorie filtern"></select></div><div id="entries"></div></section></div></div></main><script>
'use strict';
const $=id=>document.getElementById(id),KEY='ausgabenwerk-v1',base=['Lebensmittel','Essen gehen','Fahrzeug','Wohnen','Strom & Energie','Freizeit','Shopping','Gesundheit','Abos & Verträge','Sonstiges'],colors=['#71edb6','#73b7ff','#ffbc70','#ba9aff','#ff829d','#66dedc','#e5d775','#a8b8ff','#d59b72','#9eafbd'];
const today=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)},eur=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(n/100);
function validate(s){if(!s||s.version!==1||!Array.isArray(s.categories)||!Array.isArray(s.entries)||s.categories.length>200||s.entries.length>100000)throw Error('Ungültige Sicherung');if(s.categories.some(c=>typeof c!=='string'||!c.trim()||c.length>60)||new Set(s.categories).size!==s.categories.length)throw Error('Ungültige Kategorien');const ids=new Set();for(const e of s.entries){if(!e||typeof e.id!=='string'||ids.has(e.id)||!Number.isSafeInteger(e.cents)||e.cents<=0||!s.categories.includes(e.category)||typeof e.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(e.date)||isNaN(Date.parse(e.date))||new Date(e.date).toISOString().slice(0,10)!==e.date||typeof e.note!=='string'||e.note.length>200)throw Error('Ungültige Buchung');ids.add(e.id)}return s}
let state={version:1,categories:base,entries:[]},editing=null,storageOK=true;try{const raw=localStorage.getItem(KEY);if(raw)state=validate(JSON.parse(raw))}catch(e){storageOK=false;alert('Gespeicherte Daten konnten nicht gelesen werden. Sie werden nicht überschrieben. Bitte Sicherung importieren oder Browser-Speicher prüfen.')}
function commit(next){if(!storageOK){alert('Speichern blockiert: Bitte zuerst eine gültige Sicherung importieren.');return false}try{localStorage.setItem(KEY,JSON.stringify(next));state=next;return true}catch(e){alert('Speichern fehlgeschlagen. Speicherplatz oder Browser-Einstellungen prüfen.');return false}}
function options(){const old=$('category').value,f=$('filter').value;$('category').replaceChildren(...state.categories.map(c=>new Option(c,c)));$('filter').replaceChildren(new Option('Alle Kategorien',''),...state.categories.map(c=>new Option(c,c)));if(state.categories.includes(old))$('category').value=old;if(state.categories.includes(f))$('filter').value=f}
function reset(){editing=null;$('form').reset();$('date').value=today();$('formTitle').textContent='Neue Ausgabe';$('save').textContent='Ausgabe speichern';$('cancel').classList.add('hidden')}
function render(){const all=state.entries.filter(e=>e.date.slice(0,7)===$('month').value),sum=all.reduce((s,e)=>s+e.cents,0);$('total').textContent=eur(sum);$('count').textContent=all.length;const groups=state.categories.map((c,i)=>({c,color:colors[i%colors.length],n:all.filter(e=>e.category===c).reduce((s,e)=>s+e.cents,0)})).filter(g=>g.n).sort((a,b)=>b.n-a.n);$('chart').replaceChildren();if(!sum){const p=document.createElement('p');p.className='empty';p.textContent='Noch keine Ausgaben in diesem Monat.';$('chart').append(p)}else{const donut=document.createElement('div');donut.className='donut';donut.setAttribute('role','img');donut.setAttribute('aria-label','Ausgaben nach Kategorie; Beträge stehen daneben');let pos=0;donut.style.background='conic-gradient('+groups.map(g=>{const start=pos;pos+=g.n/sum*100;return `${g.color} ${start}% ${pos}%`}).join(',')+')';const legend=document.createElement('div');legend.className='legend';for(const g of groups){const line=document.createElement('div'),top=document.createElement('div'),name=document.createElement('span'),value=document.createElement('span'),dot=document.createElement('i'),bar=document.createElement('div'),fill=document.createElement('i');top.className='legendline';dot.className='dot';dot.style.background=g.color;name.append(dot,document.createTextNode(g.c));value.textContent=eur(g.n)+' · '+Math.round(g.n/sum*100)+' %';top.append(name,value);bar.className='bar';fill.style.width=g.n/sum*100+'%';fill.style.background=g.color;bar.append(fill);line.append(top,bar);legend.append(line)}$('chart').append(donut,legend)}
const entries=all.filter(e=>!$('filter').value||e.category===$('filter').value).sort((a,b)=>b.date.localeCompare(a.date));$('entries').replaceChildren();if(!entries.length){const p=document.createElement('p');p.className='empty';p.textContent='Keine Buchungen vorhanden.';$('entries').append(p)}for(const e of entries){const row=document.createElement('div'),info=document.createElement('div'),title=document.createElement('strong'),sub=document.createElement('small'),amount=document.createElement('strong'),edit=document.createElement('button'),del=document.createElement('button');row.className='entry';info.className='info';title.textContent=e.note||e.category;sub.textContent=e.date.split('-').reverse().join('.')+' · '+e.category;info.append(title,sub);amount.textContent=eur(e.cents);edit.textContent='Ändern';edit.onclick=()=>{editing=e.id;$('amount').value=(e.cents/100).toFixed(2).replace('.',',');$('category').value=e.category;$('date').value=e.date;$('note').value=e.note;$('formTitle').textContent='Ausgabe bearbeiten';$('save').textContent='Änderung speichern';$('cancel').classList.remove('hidden');$('form').scrollIntoView({behavior:'smooth'});$('amount').focus()};del.textContent='Löschen';del.onclick=()=>{if(confirm('Diese Ausgabe wirklich löschen?')&&commit({...state,entries:state.entries.filter(x=>x.id!==e.id)})){if(editing===e.id)reset();render()}};row.append(info,amount,edit,del);$('entries').append(row)}}
$('form').onsubmit=e=>{e.preventDefault();const value=$('amount').value.trim();if(!/^\d+(?:[,.]\d{1,2})?$/.test(value)){alert('Bitte einen positiven Betrag mit höchstens zwei Nachkommastellen eingeben.');return}const parts=value.replace(',','.').split('.'),cents=Number(parts[0])*100+Number((parts[1]||'').padEnd(2,'0'));if(!Number.isSafeInteger(cents)||cents<=0){alert('Ungültiger Betrag');return}const entry={id:editing||crypto.randomUUID(),cents,category:$('category').value,date:$('date').value,note:$('note').value.trim()};const next={...state,entries:[...state.entries.filter(x=>x.id!==entry.id),entry]};try{validate(next)}catch{alert('Bitte Eingaben überprüfen');return}if(commit(next)){$('month').value=entry.date.slice(0,7);reset();render();$('message').textContent='Ausgabe gespeichert.'}};
$('addCategory').onclick=()=>{const name=prompt('Neue Kategorie (max. 60 Zeichen):')?.trim();if(!name)return;if(name.length>60||state.categories.length>=200||state.categories.includes(name)){alert('Kategorie bereits vorhanden oder zu lang.');return}if(commit({...state,categories:[...state.categories,name]})){options();$('category').value=name;render()}};
function download(text,name,type){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}
$('backup').onclick=()=>download(JSON.stringify(state,null,2),'AusgabenWerk-Sicherung-'+today()+'.json','application/json');$('restore').onclick=()=>$('file').click();$('file').onchange=async()=>{try{const f=$('file').files[0];if(!f)return;if(f.size>30000000)throw Error('Datei zu groß');const s=validate(JSON.parse(await f.text()));if(!confirm(`Sicherung mit ${s.entries.length} Buchungen importieren? Alle aktuellen Daten werden ersetzt. Vorher bei Bedarf eine Sicherung erstellen.`))return;const prior=storageOK;storageOK=true;if(commit(s)){options();reset();render();$('message').textContent='Sicherung importiert.'}else storageOK=prior}catch(e){alert('Import fehlgeschlagen: '+e.message)}finally{$('file').value=''}};
$('csv').onclick=()=>{const q=x=>'"'+String(x).replace(/"/g,'""')+'"';const rows=state.entries.filter(e=>e.date.slice(0,7)===$('month').value).sort((a,b)=>a.date.localeCompare(b.date));download('\uFEFF'+[['Datum','Kategorie','Betrag EUR','Notiz'],...rows.map(e=>[e.date,e.category,(e.cents/100).toFixed(2).replace('.',','),e.note])].map(r=>r.map(x=>q(/^[=+@\-\t\r]/.test(String(x))?"'"+x:x)).join(';')).join('\r\n'),'AusgabenWerk-'+$('month').value+'.csv','text/csv;charset=utf-8')};$('cancel').onclick=reset;$('month').onchange=render;$('filter').onchange=render;$('month').value=today().slice(0,7);options();reset();render();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
